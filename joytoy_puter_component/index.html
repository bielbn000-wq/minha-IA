
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/streamlit-component-lib@1.5.0/dist/index.js"></script>
  <script src="https://js.puter.com/v2/"></script>
</head>
<body>
<script>
(() => {
  const Streamlit = window.Streamlit;
  let ultimoId = null;

  Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, async (event) => {
    const job = event.detail.args.job;

    if (!job || !job.id || job.id === ultimoId) return;
    ultimoId = job.id;

    let timer;

    try {
      if (!window.puter || !puter.ai) {
        throw new Error("Puter.js não carregou.");
      }

      const result = await Promise.race([
        puter.ai.chat(job.prompt, { model: job.model }),
        new Promise((_, reject) => {
          timer = setTimeout(
            () => reject(new Error("Tempo esgotado após 15 segundos.")),
            15000
          );
        })
      ]);

      let answer = "";

      if (typeof result === "string") {
        answer = result;
      } else {
        const content =
          result?.message?.content ??
          result?.choices?.[0]?.message?.content ??
          result?.text;

        answer = typeof content === "string"
          ? content
          : Array.isArray(content)
            ? content.map(x =>
                typeof x === "string" ? x : (x.text || "")
              ).join("")
            : "";
      }

      Streamlit.setComponentValue({
        id: job.id,
        answer,
        error: answer ? null : "O modelo retornou uma resposta vazia."
      });

    } catch (error) {
      Streamlit.setComponentValue({
        id: job.id,
        answer: "",
        error: error?.message || String(error)
      });
    } finally {
      clearTimeout(timer);
    }
  });

  Streamlit.setComponentReady();
  Streamlit.setFrameHeight(0);
})();
</script>
</body>
</html>
